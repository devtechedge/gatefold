name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatefold
          POSTGRES_PASSWORD: gatefold
          POSTGRES_DB: gatefold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatefold -d gatefold_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gatefold:gatefold@localhost:5432/gatefold_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://gatefold:gatefold@localhost:5432/gatefold_test?schema=public
      DATABASE_URL_TEST: postgresql://gatefold:gatefold@localhost:5432/gatefold_test?schema=public
      DATABASE_URL_TEST_UNPOOLED: postgresql://gatefold:gatefold@localhost:5432/gatefold_test?schema=public
      DATABASE_URL_E2E: postgresql://gatefold:gatefold@localhost:5432/gatefold_test?schema=public
      DATABASE_URL_E2E_UNPOOLED: postgresql://gatefold:gatefold@localhost:5432/gatefold_test?schema=public
      SESSION_PEPPER: ci-session-pepper-not-a-production-secret
      TICKET_SIGNING_SECRET: ci-ticket-signing-secret-not-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      CRON_SECRET: ci-cron-secret-not-production
      ALLOW_PROD_SEED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare browser-test database
        run: node scripts/prepare-e2e-db.mjs
      - name: Browser journeys and accessibility
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
